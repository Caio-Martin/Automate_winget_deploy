<!-- viewBox justo ao desenho (x 1..129, y 3..122) para o logo preencher
     todo o espaco em que for renderizado, sem margem morta nem corte. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 3 128 119" width="128" height="119" role="img" aria-label="WinGet Toolkit">
    <title>WinGet Toolkit</title>
    <defs>
        <linearGradient id="wtScreen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6aa9e0" />
            <stop offset="0.5" stop-color="#4b93d8" />
            <stop offset="1" stop-color="#2f7fd0" />
        </linearGradient>
    </defs>

    <!-- Tres setas convergindo para o computador -->
    <g fill="#2170b8" stroke="#2170b8" stroke-width="12" stroke-linecap="round">
        <!-- Esquerda: entra pela lateral e aponta para baixo-direita -->
        <path d="M7 30C20 30 31 34 37 43" fill="none" />
        <polygon points="24,40 50,40 37,62" stroke="none" transform="rotate(-32 37 44)" />

        <!-- Centro: desce curvando levemente -->
        <path d="M50 9C60 17 65 27 65 40" fill="none" />
        <polygon points="52,38 78,38 65,60" stroke="none" />

        <!-- Direita: espelha a da esquerda -->
        <path d="M123 30C110 30 99 34 93 43" fill="none" />
        <polygon points="106,40 80,40 93,62" stroke="none" transform="rotate(32 93 44)" />
    </g>

    <!-- Monitor -->
    <rect x="31" y="68" width="66" height="44" rx="7" fill="#919598" />
    <rect x="36.5" y="73.5" width="55" height="31" rx="3.5" fill="url(#wtScreen)" />

    <!-- Check na tela -->
    <circle cx="64" cy="89" r="11" fill="#ffffff" opacity="0.22" />
    <path d="M58.4 89.2l3.9 4 7.3-7.6" fill="none" stroke="#ffffff" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pe e base -->
    <rect x="58.5" y="112" width="11" height="5" fill="#6f7376" />
    <rect x="44" y="116" width="40" height="6" rx="3" fill="#6f7376" />
</svg>
